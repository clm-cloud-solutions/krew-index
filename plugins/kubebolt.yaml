# This is the TEMPLATE for the krew plugin manifest.
#
# Placeholders are replaced by the release workflow:
#   1.10.0-rc.2          - Tag without v prefix (e.g., 1.2.3)
#   __SHA_*_TGZ__        - SHA256 of each tar.gz archive
#
# Users install with:
#   # Option A (after upstream acceptance):
#   kubectl krew install kubebolt
#
#   # Option B (custom index, before upstream acceptance):
#   kubectl krew index add clm https://github.com/clm-cloud-solutions/krew-index.git
#   kubectl krew install clm/kubebolt
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kubebolt
spec:
  version: v1.10.0-rc.2
  homepage: https://github.com/clm-cloud-solutions/kubebolt
  shortDescription: "Instant Kubernetes monitoring — full cluster visibility in under 2 minutes"
  description: |
    KubeBolt gives you full cluster visibility in under 2 minutes.
    No agents, no Prometheus, no configuration. 23 resource views,
    interactive cluster topology map, 12-rule insights engine,
    and built-in AI copilot.

    Run `kubectl kubebolt` to start the dashboard on http://localhost:8080.
  caveats: |
    This plugin starts a local web server with the KubeBolt dashboard.
    Open the URL printed on stdout in your browser.
    Press Ctrl+C to stop.

    On first boot, an admin password is generated and printed to logs.
    Override with the KUBEBOLT_ADMIN_PASSWORD env var or a .env file.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.10.0-rc.2/kubebolt-darwin-arm64.tar.gz
      sha256: 3792d55018c9f303d79112d9ff0dfb6ca02e005d3662a25d6fe615eadb992be6
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.10.0-rc.2/kubebolt-darwin-amd64.tar.gz
      sha256: 5aee52d87c762c6c3d62cbe86e56c1395a1ea49cc8b77c7eea3c6f2c3400c078
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.10.0-rc.2/kubebolt-linux-arm64.tar.gz
      sha256: d9e3d392a3fc9e99c8b4ed873034ad713cb2e19b7e4c80efe40353701d57349e
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.10.0-rc.2/kubebolt-linux-amd64.tar.gz
      sha256: 12254625487cacc48e8e1b4582ec5e0cff1cb5e15eceab615f1d654f0eef46b7
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.10.0-rc.2/kubebolt-windows-amd64.zip
      sha256: be5fe6ca2b1e0b77f66d82cfb342101de5d9318dd3ed371d315e9299af25574b
      bin: kubectl-kubebolt.exe
