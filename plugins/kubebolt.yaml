# This is the TEMPLATE for the krew plugin manifest.
#
# Placeholders are replaced by the release workflow:
#   1.15.0-rc.3          - Tag without v prefix (e.g., 1.2.3)
#   __SHA_*_TGZ__        - SHA256 of each tar.gz archive
#
# Users install with:
#   # Option A (after upstream acceptance):
#   kubectl krew install kubebolt
#
#   # Option B (custom index, before upstream acceptance):
#   kubectl krew index add clm https://github.com/clm-cloud-solutions/krew-index.git
#   kubectl krew install clm/kubebolt
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kubebolt
spec:
  version: v1.15.0-rc.3
  homepage: https://github.com/clm-cloud-solutions/kubebolt
  shortDescription: "Instant Kubernetes monitoring — full cluster visibility in under 2 minutes"
  description: |
    KubeBolt gives you full cluster visibility in under 2 minutes.
    No agents, no Prometheus, no configuration. 23 resource views,
    interactive cluster topology map, 12-rule insights engine,
    and built-in AI copilot.

    Run `kubectl kubebolt` to start the dashboard on http://localhost:8080.
  caveats: |
    This plugin starts a local web server with the KubeBolt dashboard.
    Open the URL printed on stdout in your browser.
    Press Ctrl+C to stop.

    On first boot, an admin password is generated and printed to logs.
    Override with the KUBEBOLT_ADMIN_PASSWORD env var or a .env file.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.15.0-rc.3/kubebolt-darwin-arm64.tar.gz
      sha256: b3e70e3dffd1f9b63f12920c4bd4eba638e5ab4948bb20bd0d7d9c5e29e0049d
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.15.0-rc.3/kubebolt-darwin-amd64.tar.gz
      sha256: f9ce04d52ac3da026eb45be04e0d114e67bdc31b8565d13c2dffb435dd875d04
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.15.0-rc.3/kubebolt-linux-arm64.tar.gz
      sha256: 01c2b46c59bfed3dc910208b4fad03a7d85bf466e7af66d9445d4b96cdd13244
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.15.0-rc.3/kubebolt-linux-amd64.tar.gz
      sha256: b42451002e5cf05735c5bdab84dcb395018f6b73feee6396ff814d962b3f04bc
      bin: kubectl-kubebolt
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/clm-cloud-solutions/kubebolt/releases/download/v1.15.0-rc.3/kubebolt-windows-amd64.zip
      sha256: f1d8f6df0bd445cc73d9f052a69e2b495c516d48c0825a5f3c8b9987e40ea37a
      bin: kubectl-kubebolt.exe
